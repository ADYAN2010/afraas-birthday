<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffeaa7" stop-opacity="1"/>
      <stop offset="100%" stop-color="#dfb65b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faeed1"/>
      <stop offset="50%" stop-color="#e6c587"/>
      <stop offset="100%" stop-color="#bfa14e"/>
    </linearGradient>
    <linearGradient id="cakeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8cfdf"/>
      <stop offset="100%" stop-color="#e0688c"/>
    </linearGradient>
  </defs>
  <!-- Background circle with midnight glow -->
  <circle cx="32" cy="32" r="30" fill="#120921" stroke="#e6c587" stroke-width="1.5"/>
  <!-- Candle Flame -->
  <path d="M32 10 C30 16, 28 20, 32 23 C36 20, 34 16, 32 10 Z" fill="#ffd166"/>
  <circle cx="32" cy="18" r="4" fill="#ff7675" opacity="0.6"/>
  <!-- Candle -->
  <rect x="30" y="23" width="4" height="10" rx="1.5" fill="#faeed1"/>
  <!-- Cake Top Layer -->
  <rect x="20" y="33" width="24" height="10" rx="3" fill="#f8cfdf"/>
  <path d="M20 37 Q23 39 26 37 Q29 39 32 37 Q35 39 38 37 Q41 39 44 37" stroke="#e0688c" stroke-width="1.5" fill="none"/>
  <!-- Cake Bottom Layer -->
  <rect x="15" y="43" width="34" height="12" rx="4" fill="url(#cakeGrad)"/>
  <!-- Gold Cake Stand / Plate -->
  <path d="M12 55 Q32 58 52 55 L50 57 Q32 60 14 57 Z" fill="url(#goldGrad)"/>
  <!-- Sparkles -->
  <circle cx="16" cy="18" r="1.5" fill="#faeed1"/>
  <circle cx="48" cy="20" r="1.5" fill="#faeed1"/>
</svg>
